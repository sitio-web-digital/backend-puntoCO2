services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: matafuego
      POSTGRES_PASSWORD: matafuego_dev_only
      POSTGRES_DB: matafuego_saas
    ports:
      - "5436:5432"
    volumes:
      - matafuego_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matafuego -d matafuego_saas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  matafuego_db_data:
